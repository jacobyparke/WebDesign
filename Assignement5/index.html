<!DOCTYPE html>
<html lang="en">

<head>

  >

  <link

    href="styles/styles2.css"
  >

</head>

<body>

  <!-- =========================

  ========================= -->

    <span class="dew dew-1"></span>
    <span class="dew dew-2"></span>
    <span class="dew dew-3"></span>

  <!-- =========================
       NAVIGATION
  ========================= -->

  <nav>

    <a href="index.html">
      <i class="bi bi-house-fill"></i>
      Home

    <a href="about.html">
      <i class="bi bi-file-earmark-text-fill"></i>

    <a href="info.html">
      <i class="bi bi-search"></i>
      Info
    </a>

  </nav>


  <!-- =========================
       HERO
  ========================= -->

  <header class="hero">

    <div class="marquee">

      <div class="marquee-track">

        <span class="marquee-word">
          <span>K</span><span>o</span><span>b</span><span>e</span>
          <span>K</span><span>o</span><span>l</span><span>o</span><span>r</span>
        </span>

        <span class="marquee-word">
          <span>K</span><span>o</span><span>b</span><span>e</span>
          <span>K</span><span>o</span><span>l</span><span>o</span><span>r</span>
        </span>

        <span class="marquee-word">
          <span>K</span><span>o</span><span>b</span><span>e</span>
          <span>K</span><span>o</span><span>l</span><span>o</span><span>r</span>
        </span>

        <span class="marquee-word">
          <span>K</span><span>o</span><span>b</span><span>e</span>
          <span>K</span><span>o</span><span>l</span><span>o</span><span>r</span>
        </span>

        <span class="marquee-word">
          <span>K</span><span>o</span><span>b</span><span>e</span>
          <span>K</span><span>o</span><span>l</span><span>o</span><span>r</span>
        </span>

        <span class="marquee-word">
          <span>K</span><span>o</span><span>b</span><span>e</span>
          <span>K</span><span>o</span><span>l</span><span>o</span><span>r</span>
        </span>

      </div>

    </div>

  </header>


  <!-- =========================
       SOCIAL LINKS
  ========================= -->

  <section class="social-section">

    <table class="social-table">

      <tr>

        <td>

          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube"
          >

            <img
              src="https://cdn.simpleicons.org/youtube/ffffff"
              alt="YouTube"
              width="38"
              height="38"
              loading="lazy"
              decoding="async"
            >

          </a>

        </td>


        <td>

          <a
            href="https://open.spotify.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Spotify"
          >

            <img
              src="https://cdn.simpleicons.org/spotify/ffffff"
              alt="Spotify"
              width="38"
              height="38"
              loading="lazy"
              decoding="async"
            >

          </a>

        </td>


        <td>

          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >

            <img
              src="https://cdn.simpleicons.org/instagram/ffffff"
              alt="Instagram"
              width="38"
              height="38"
              loading="lazy"
              decoding="async"
            >

          </a>

        </td>

      </tr>

    </table>

  </section>


  <!-- =========================
       SPOTIFY
  ========================= -->

  <section class="spotify-section">

    <div class="card spotify-card">

      <h2>
        ♫ songs I listen to most ♫
      </h2>

      <iframe
        src="https://open.spotify.com/embed/playlist/2O6gA5Qds6zKEZj4rjIHHZ?utm_source=generator&theme=0"
        width="100%"
        height="352"
        title="Spotify playlist"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"
      ></iframe>

    </div>

  </section>


  <!-- =========================
       MOOD BOARD
  ========================= -->

  <section class="mood-board">

    <div class="image-marquee">

      <div class="card-group">

        <div class="card">
          <img
            src="https://jacobyparke.github.io/WebDesign/Assignment2/babyblue.jpg"
            alt="Baby blue mood board image"
            width="220"
            height="220"
            loading="lazy"
            decoding="async"
          >
        </div>

        <div class="card">
          <img
            src="https://jacobyparke.github.io/WebDesign/Assignment2/anna.jpg"
            alt="Anna mood board image"
            width="220"
            height="220"
            loading="lazy"
            decoding="async"
          >
        </div>

        <div class="card">
          <img
            src="https://jacobyparke.github.io/WebDesign/Assignment2/surgery.jpg"
            alt="Surgery mood board image"
            width="220"
            height="220"
            loading="lazy"
            decoding="async"
          >
        </div>

        <div class="card">
          <img
            src="https://jacobyparke.github.io/WebDesign/Assignment2/headphones.jpg"
            alt="Headphones mood board image"
            width="220"
            height="220"
            loading="lazy"
            decoding="async"
          >
        </div>

        <div class="card">
          <img
            src="https://jacobyparke.github.io/WebDesign/Assignment2/yellow.jpg"
            alt="Yellow mood board image"
            width="220"
            height="220"
            loading="lazy"
            decoding="async"
          >
        </div>

        <div class="card">
          <img
            src="https://jacobyparke.github.io/WebDesign/Assignment2/trisha.jpg"
            alt="Trisha mood board image"
            width="220"
            height="220"
            loading="lazy"
            decoding="async"
          >
        </div>

        <div class="card">
          <img
            src="https://jacobyparke.github.io/WebDesign/Assignment2/feedme.jpg"
            alt="Feed me mood board image"
            width="220"
            height="220"
            loading="lazy"
            decoding="async"
          >
        </div>

        <div class="card">
          <img
            src="https://jacobyparke.github.io/WebDesign/Assignment2/kate.jpg"
            alt="Kate mood board image"
            width="220"
            height="220"
            loading="lazy"
            decoding="async"
          >
        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       PINTEREST
  ========================= -->

  <section class="pinterest-section">

    <a
      class="pinterest-button"
      href="https://pin.it/6JIwiapKD"
      target="_blank"
      rel="noopener noreferrer"
    >

      <img
        src="https://cdn.simpleicons.org/pinterest/ffffff"
        alt="Pinterest"
        width="22"
        height="22"
        loading="lazy"
        decoding="async"
      >

      <span>
        VIEW MOOD BOARD
      </span>

    </a>

  </section>


  <!-- =========================
       PROJECT
  ========================= -->

  <section class="project-section">

    <a
      href="about.html"
      class="project-link"
    >
      ABOUT THIS PROJECT →
    </a>

  </section>


  <!-- =========================
       CONTACT
  ========================= -->

  <section class="contact-section">

    <div class="card contact-card">

      <h2>
        contact
      </h2>

      <form class="contact-form">

        <input
          type="text"
          name="name"
          placeholder="name"
          aria-label="Name"
          required
        >

        <input
          type="email"
          name="email"
          placeholder="email"
          aria-label="Email"
          required
        >

        <textarea
          name="message"
          placeholder="message"
          aria-label="Message"
          required
        ></textarea>

        <button type="submit">
          send
        </button>

      </form>

    </div>

  </section>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <p>Kobe Kolor</p>

    <p>
      Creative landing page and visual mood board.
    </p>

  </footer>

</body>

</html>
