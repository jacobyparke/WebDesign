<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community, Missoula</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/morphing-logo.png" alt="Morphing Logo" class="morphing-logo">
            <h1>Community, Missoula</h1>
            <p>Weekly Local Business and Activity Recommendations to Support a Closer Community</p>
        </div>
    </header>

    <main>
        <section class="highlights">
            <h2>Weekly Highlights</h2>
            <div class="flexbox-container">
                <div class="highlight">
                    <img src="business-placeholder.jpg" alt="Business Highlight">
                    <a href="business-info.html" class="more-info">More Info</a>
                </div>
                <div class="highlight">
                    <img src="activity-placeholder.jpg" alt="Activity Highlight">
                    <a href="activity-info.html" class="more-info">More Info</a>
                </div>
            </div>
        </section>

        <section class="contact-form">
            <h2>Business & Activity Recommendation Submission</h2>
            <div class="contact-box">
                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                    
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" required>
                    
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>
                    
                    <button type="submit">Submit</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Community, Missoula</p>
    </footer>
</body>
</html>
